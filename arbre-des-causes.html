<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbre des causes – Analyse d'accident du travail</title>
<meta name="description" content="Application autonome d'aide à l'analyse des accidents du travail par la méthode de l'arbre des causes (référence : INRS ED 6163).">
<style>
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#18202E; --muted:#556072; --line:#D6DDE7; --line-2:#E7ECF2;
  --primary:#1D58A6; --primary-d:#143F7A; --primary-l:#E7EFFA;
  --accent:#D9680A; --accent-l:#FFF0E0;
  --ok:#1B7342; --ok-l:#E2F3E9;
  --warn:#8A5300; --warn-l:#FFF3D1;
  --bad:#B42318; --bad-l:#FDE7E5;
  --hyp:#6A3B9E; --hyp-l:#F1E9FB;
  --miss:#4E5968; --miss-l:#ECEFF3;
  --etat:#1D58A6; --etat-fill:#EAF1FB;
  --var:#B42318; --var-fill:#FDEEEC;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 3px 10px rgba(16,24,40,.06);
  --focus:0 0 0 3px #FFB255;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
a{color:var(--primary)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:.3em 0 .7em}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}

/* ---------- Barre supérieure ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--primary-d);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;color:#fff;text-decoration:none;background:none;border:0;cursor:pointer;padding:4px;font-family:inherit}
.brand svg{flex:none}
.top-title{flex:1;min-width:160px;font-size:.92rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{font-size:.82rem;opacity:.9;display:flex;align-items:center;gap:6px}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:#6FD39A;display:inline-block}
.save-state.pending .dot{background:#FFC857}
.save-state.error .dot{background:#FF7A6E}
.topbar .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.topbar .btn:hover{background:rgba(255,255,255,.22)}

/* ---------- Étapes ---------- */
.stepper{background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:52px;z-index:20}
.stepper ol{list-style:none;margin:0;padding:8px 12px;display:flex;gap:4px;min-width:max-content}
.stepper button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;padding:6px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:.88rem;color:var(--muted)}
.stepper button:hover{background:var(--primary-l);color:var(--primary-d)}
.stepper .num{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--line-2);color:var(--ink);font-weight:700;font-size:.8rem;flex:none}
.stepper [aria-current="step"]{background:var(--primary);color:#fff}
.stepper [aria-current="step"] .num{background:#fff;color:var(--primary)}
.stepper .done .num{background:var(--ok);color:#fff}
.stepper .meta{font-size:.72rem;opacity:.85}
.progress{height:4px;background:var(--line-2)}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s}

/* ---------- Mise en page ---------- */
main{max-width:1240px;margin:0 auto;padding:20px 16px 110px}
main.wide{max-width:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card.tight{padding:12px 14px}
.card h2{display:flex;align-items:center;gap:10px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.xs{font-size:.78rem}
.lead{font-size:1.05rem;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;background:var(--line-2);color:var(--ink)}
.kbd{font-family:Consolas,monospace;font-size:.85em;background:var(--line-2);padding:0 4px;border-radius:4px}

/* ---------- Formulaires ---------- */
label,.label{font-weight:600;font-size:.92rem;display:block;margin-bottom:4px}
.hint{font-size:.82rem;color:var(--muted);font-weight:400;margin-top:3px}
.field{display:flex;flex-direction:column}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  width:100%;font:inherit;font-size:.95rem;padding:9px 11px;border:1px solid #B9C3D1;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,88,166,.18)}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--bad)}
.err{color:var(--bad);font-size:.85rem;margin-top:4px;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
legend{font-weight:600;font-size:.92rem;padding:0 4px}
.radio-list{display:flex;flex-direction:column;gap:6px}
.radio-list label,.check{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:0;cursor:pointer}
.radio-list input,.check input{margin-top:4px;flex:none}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.radio-cards label{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:400;display:flex;gap:8px;cursor:pointer;margin:0}
.radio-cards label:has(input:checked){border-color:var(--primary);background:var(--primary-l)}
.radio-cards input{margin-top:4px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:.92rem;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid #B9C3D1;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.2;min-height:38px}
.btn:hover{background:#F4F7FB}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:#B85607}
.btn.danger{color:var(--bad);border-color:#E9B4AE}
.btn.danger:hover{background:var(--bad-l)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--primary-l)}
.btn.sm{padding:5px 10px;font-size:.84rem;min-height:32px}
.btn.lg{padding:12px 20px;font-size:1.02rem}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);font-size:1.1rem}
.icon-btn:hover{background:var(--primary-l)}
.btn svg,.icon-btn svg{width:18px;height:18px;flex:none}
h1>svg,h2>svg,h3>svg,h4>svg,.tag>svg,.drop>svg,p>svg,summary>svg,li>svg,span>svg,b>svg,label>svg{width:20px;height:20px;flex:none;vertical-align:-4px}
.tree-empty svg{width:56px;height:56px;color:#9AA5B4}

/* ---------- Bandeaux ---------- */
.note{border-radius:10px;padding:10px 14px;margin:8px 0 12px;display:flex;gap:10px;align-items:flex-start;font-size:.92rem;border:1px solid}
.note svg{flex:none;width:20px;height:20px;margin-top:2px}
.note.info{background:var(--primary-l);border-color:#BCD0EE;color:#11315D}
.note.warn{background:var(--warn-l);border-color:#EED38C;color:#5C3800}
.note.bad{background:var(--bad-l);border-color:#F1B5AE;color:#7A1810}
.note.ok{background:var(--ok-l);border-color:#A9D9BC;color:#0F4A29}
.note.hyp{background:var(--hyp-l);border-color:#D4C0EE;color:#46246F}
.note p{margin:0 0 .3em}
.note ul{margin:.2em 0 .2em 1.1em;padding:0}

/* ---------- Statuts ---------- */
.st{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 3px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid;white-space:nowrap;vertical-align:middle}
.st .g{width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;color:#fff;font-weight:800}
.st-rapporte{background:#EEF3FA;border-color:#C2D3EA;color:#1E3E6B}.st-rapporte .g{background:#3F679E}
.st-corrobore{background:var(--ok-l);border-color:#A9D9BC;color:#0F4A29}.st-corrobore .g{background:var(--ok)}
.st-averifier{background:var(--warn-l);border-color:#EED38C;color:#5C3800}.st-averifier .g{background:#B07000}
.st-manquant{background:var(--miss-l);border-color:#C9D0DA;color:#333C48;border-style:dashed}.st-manquant .g{background:var(--miss)}
.st-contradiction{background:var(--bad-l);border-color:#F1B5AE;color:#7A1810}.st-contradiction .g{background:var(--bad)}
.st-hypothese{background:var(--hyp-l);border-color:#D4C0EE;color:#46246F;border-style:dashed}.st-hypothese .g{background:var(--hyp)}
.kind{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted)}
.kind i{display:inline-block;width:14px;height:10px;border:2px solid var(--etat);background:var(--etat-fill)}
.kind.variation i{border-radius:50%;width:13px;height:13px;border-color:var(--var);background:var(--var-fill)}
.kind.indetermine i{border-style:dotted;border-color:var(--muted);background:#fff}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.prio.haute{background:var(--bad);color:#fff}
.prio.moyenne{background:#B07000;color:#fff}
.prio.faible{background:var(--line-2);color:var(--ink)}

/* ---------- Faits ---------- */
.facts{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#FCFDFE;display:flex;gap:10px;align-items:flex-start}
.fact.is-deleted{opacity:.6;background:#F6F6F6}
.fact .ftxt{flex:1;min-width:0}
.fact .ftxt strong{font-weight:600}
.fact .fmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:.8rem;color:var(--muted)}
.fact .facts-act{display:flex;gap:4px;flex:none}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.qcard h4{margin:0 0 2px;font-size:1rem}
.qadd{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.qadd textarea{min-height:42px;height:42px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;font:inherit;font-weight:600;padding:9px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;color:var(--muted);border-radius:8px 8px 0 0}
.tabs button[aria-selected=true]{color:var(--primary-d);border-bottom-color:var(--primary);background:var(--primary-l)}
.fam{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.fam>summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none}
.fam>summary::-webkit-details-marker{display:none}
.fam>summary::before{content:"▸";color:var(--primary);transition:transform .15s}
.fam[open]>summary::before{transform:rotate(90deg)}
.fam .fam-body{padding:0 14px 12px}
.fam .letter{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;background:var(--accent-l);color:var(--accent);font-weight:800}
.check-msgs{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.check-msgs div{font-size:.84rem;padding:5px 9px;border-radius:7px;background:var(--warn-l);border:1px solid #EED38C;color:#5C3800}
.check-msgs div.ok{background:var(--ok-l);border-color:#A9D9BC;color:#0F4A29}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line-2);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#F7F9FC}
.tbl-wrap{overflow-x:auto}

/* ---------- Accueil ---------- */
.hero{background:linear-gradient(135deg,#143F7A 0%,#1D58A6 55%,#2A74C9 100%);color:#fff;border-radius:16px;padding:28px 28px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{font-size:1.85rem;margin-bottom:6px}
.hero p{opacity:.95;max-width:760px}
.hero .btn{border-color:rgba(255,255,255,.5)}
.hero .btn:not(.accent){background:rgba(255,255,255,.12);color:#fff}
.steps-intro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 6px}
.steps-intro div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 12px;font-size:.9rem}
.steps-intro b{display:block;font-size:1.3rem;color:#FFC07A}
@media (max-width:760px){.steps-intro{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px 16px}.hero h1{font-size:1.45rem}}
.an-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.an-list li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff}
.an-list .t{flex:1;min-width:200px}

/* ---------- Pièces jointes ---------- */
.drop{border:2px dashed #9DB1CD;border-radius:12px;padding:18px;text-align:center;background:#F8FAFD;cursor:pointer}
.drop.over{background:var(--primary-l);border-color:var(--primary)}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.att{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.att img{width:100%;height:170px;object-fit:cover;background:#E9EEF4;cursor:zoom-in;display:block}
.att .att-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.doc-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.doc-text{white-space:pre-wrap;font-family:inherit;font-size:.9rem;background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;user-select:text}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.info{background:var(--primary-l);color:var(--primary-d)}

/* ---------- Arbre ---------- */
.tree-shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:1000px){.tree-shell{grid-template-columns:1fr}}
.tree-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.tree-box:fullscreen{border-radius:0}
.tree-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:#F8FAFD}
.tree-tools .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.seg{display:inline-flex;border:1px solid #B9C3D1;border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;font:inherit;font-size:.84rem;font-weight:600;padding:6px 10px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.tree-canvas{position:relative;height:62vh;min-height:380px;background:
  radial-gradient(circle,#DCE3EC 1px,transparent 1px) 0 0/22px 22px,#FBFCFE;cursor:grab;touch-action:none;overflow:hidden}
.tree-box:fullscreen .tree-canvas{height:auto;flex:1}
.tree-canvas.dragging{cursor:grabbing}
.tree-canvas svg{width:100%;height:100%;display:block;user-select:none}
.tree-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus .shape,.node.sel .shape{stroke:#FF8A00!important;stroke-width:4px!important}
.edge{fill:none;stroke:#3C4656;stroke-width:1.8}
.edge.dashed{stroke-dasharray:7 5}
.edge.unconfirmed{stroke:#8A94A3}
.edge.sel{stroke:#FF8A00;stroke-width:3.5}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.side{position:sticky;top:120px;max-height:calc(100vh - 200px);overflow:auto}
@media (max-width:1000px){.side{position:static;max-height:none;overflow:visible}}
.chrono-grid{display:grid;gap:14px;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);align-items:start}
.chrono-grid>aside{position:sticky;top:130px;max-height:calc(100vh - 220px);overflow:auto}
@media (max-width:900px){.chrono-grid{grid-template-columns:1fr}.chrono-grid>aside{position:static;max-height:none}}
.side .card{margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px 18px;font-size:.82rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);background:#F8FAFD}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-rect{width:22px;height:13px;border:2px solid var(--etat);background:var(--etat-fill)}
.lg-circ{width:18px;height:18px;border:2px solid var(--var);background:var(--var-fill);border-radius:50%}
.lg-dash{width:26px;border-top:2px dashed #3C4656}
.lg-line{width:26px;border-top:2px solid #3C4656}
.lg-nv{width:22px;height:13px;border:2px dashed #B07000;background:#FFF8E6}
.outline ul{list-style:none;margin:0;padding-left:20px;border-left:2px solid var(--line-2)}
.outline>ul{padding-left:0;border-left:0}
.outline li{margin:4px 0}
.outline .rel{font-size:.78rem;color:var(--muted);font-style:italic}

/* ---------- Divers ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.kpi b{display:block;font-size:1.5rem}
.kpi span{font-size:.82rem;color:var(--muted)}
.gap{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.gap.haute{border-left-color:var(--bad)}
.gap.moyenne{border-left-color:#B07000}
.gap.faible{border-left-color:#9AA5B4}
.gap dl{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;margin:8px 0;font-size:.9rem}
.gap dt{font-weight:600;color:var(--muted)}
.gap dd{margin:0}
@media (max-width:640px){.gap dl{grid-template-columns:1fr}.gap dt{margin-top:6px}}
.navfoot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.navfoot .info{font-size:.84rem;color:var(--muted);text-align:center;flex:1}
#toasts{position:fixed;right:16px;bottom:76px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:#18202E;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)} .toast.warn{background:#8A5300}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--ink)}
dialog.wide{width:min(940px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(15,25,40,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h2{flex:1;margin:0;font-size:1.1rem}
.dlg .dlg-body{padding:16px 18px;overflow:auto}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;background:#F8FAFD}
.lightbox img{max-width:100%;max-height:70vh;display:block;margin:0 auto}
.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--primary-l);margin-left:8px}
.timeline li{position:relative;padding:4px 0 8px 18px}
.timeline li::before{content:"";position:absolute;left:-8px;top:10px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--primary)}
.timeline .ph{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--primary-d);font-weight:700}
.why-level{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:8px 0 8px 6px}
.why-level .q{font-weight:700;color:var(--accent)}
.conf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.conf .meter{display:flex;gap:4px}
.conf .meter i{width:34px;height:12px;border-radius:3px;background:var(--line-2);display:block}
.conf.c1 .meter i:nth-child(1){background:var(--bad)}
.conf.c2 .meter i:nth-child(-n+2){background:#B07000}
.conf.c3 .meter i{background:var(--ok)}
.hist{font-size:.84rem}
.hist li{margin-bottom:4px}
@media (max-width:640px){
  main{padding:14px 12px 120px}
  .card{padding:14px}
  .topbar{padding:8px 12px;position:static;gap:6px 10px}
  .top-title{order:3;flex-basis:100%;font-size:.84rem}
  .save-state{font-size:.74rem;order:4;flex-basis:100%}
  .stepper{top:auto;position:static}
  .navfoot .info{display:none}
  .fact{flex-wrap:wrap}
  .fact .facts-act{width:100%;justify-content:flex-end}
  .qadd{flex-direction:column;align-items:stretch}
  .tree-canvas{height:55vh}
}
@media print{
  .topbar,.stepper,.navfoot,#toasts,.no-print{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

const $ = (s, r = document) => r.querySelector(s);

const nowISO = () => new Date().toISOString();

function setPath(o, p, v) { const ks = p.split('.'); let x = o; ks.slice(0, -1).forEach(k => { if (x[k] == null) x[k] = {}; x = x[k]; }); x[ks[ks.length - 1]] = v; }
function slug(s) { return String(s || 'analyse').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'analyse'; }
function stamp() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }

function activeLinks(a = S.a) {
  const alive = new Set(a.facts.filter(f => !f.deleted).map(f => f.id));
  return a.links.filter(l => !l.deleted && alive.has(l.from) && alive.has(l.to));

function inTree(id, a = S.a) { return a.tree.rootId === id || activeLinks(a).some(l => l.from === id || l.to === id); }
function ins(id, a = S.a) { return activeLinks(a).filter(l => l.to === id); }

function isAncestor(x, y, a = S.a) { // existe-t-il un chemin x → … → y ?
  const L = activeLinks(a); const seen = new Set(); const st = [x];
  while (st.length) { const n = st.pop(); for (const l of L) if (l.from === n && !seen.has(l.to)) { if (l.to === y) return true; seen.add(l.to); st.push(l.to); } }
  return false;
}

function independenceIssues(a = S.a) {
  const L = activeLinks(a); const res = [];
  const byTo = {}, byFrom = {};
  L.forEach(l => { (byTo[l.to] = byTo[l.to] || []).push(l.from); (byFrom[l.from] = byFrom[l.from] || []).push(l.to); });
  for (const [y, xs] of Object.entries(byTo)) for (let i = 0; i < xs.length; i++) for (let j = i + 1; j < xs.length; j++) {
    if (isAncestor(xs[i], xs[j], a) || isAncestor(xs[j], xs[i], a)) res.push({ type: 'conjonction', at: y, a: xs[i], b: xs[j] });
  }
  for (const [x, ys] of Object.entries(byFrom)) for (let i = 0; i < ys.length; i++) for (let j = i + 1; j < ys.length; j++) {
    if (isAncestor(ys[i], ys[j], a) || isAncestor(ys[j], ys[i], a)) res.push({ type: 'disjonction', at: x, a: ys[i], b: ys[j] });

}

/* Modèle d'affichage : arbre de travail (tout) ou arbre retenu (faits établis reliés au fait ultime) */
function graphModel(a, view) {
  const facts = new Map(a.facts.filter(f => !f.deleted).map(f => [f.id, f]));
  let links = activeLinks(a);
  let nodeIds = new Set(); links.forEach(l => { nodeIds.add(l.from); nodeIds.add(l.to); });
  const root = a.tree.rootId && facts.has(a.tree.rootId) ? a.tree.rootId : null;
  if (root) nodeIds.add(root);
  let excluded = [];
  if (view === 'retenu') {
    const est = id => isEst(facts.get(id), a);
    links = links.filter(l => est(l.from) && est(l.to));
    const keep = new Set();
    if (root && est(root)) { keep.add(root); const st = [root]; while (st.length) { const y = st.pop(); links.filter(l => l.to === y).forEach(l => { if (!keep.has(l.from)) { keep.add(l.from); st.push(l.from); } }); } }
    excluded = [...nodeIds].filter(id => !keep.has(id));
    links = links.filter(l => keep.has(l.from) && keep.has(l.to)); nodeIds = keep;
  }
  return { facts, links, nodeIds, root, excluded, view };
}

/* ---------------- Contrôle de la formulation (INRS ED 6163 : un fait n'est ni une interprétation, ni une opinion, ni un jugement, ni un « fait négatif ») ---------------- */
const WORDING = [
  { re: /(absence|manque|d[ée]faut|insuffisance|carence|non[- ]respect)\s+(de|d['’]|du|des)/i, msg: "« Fait négatif » : la formulation décrit ce qui aurait dû exister (la mesure de prévention) et non ce qui s'est passé. Décrivez la situation réelle observée." },
  { re: /(^|[\s,;(])(ne|n['’])\s?[^\s]+\s+(pas|jamais|plus|aucun|aucune|guère)([\s.,;!)]|$)|(^|\s)pas\s+(de|d['’])\s/i, msg: "Formulation négative : décrivez ce qui a été observé (ex. « travaillait en chaussures de ville ») plutôt que ce qui n'a pas été fait." },
  { re: /(vigilan|inattenti|distrai|n[ée]glig|impruden|inconscien|maladr|erreur humaine|faute|comportement dangereux|mauvaise organisation|d[ée]faut de pr[ée]vention|manque de formation|t[ée]m[ée]rair|laxis|irrespons|n['’]a pas fait attention|ne faisait pas attention|je[- ]m['’]en[- ]foutis|insouciance)/i, msg: "Jugement ou formulation vague : remplacez-la par la description des faits réellement constatés, sans attribuer d'intention ni porter de jugement." },
  { re: /(^|\s)(trop|mauvais|mauvaise|dangereu\w*|insuffisant\w*|inadapt\w*|anormal\w*)(\s|[.,;]|$)/i, msg: "Qualificatif à objectiver : précisez une valeur ou une observation (ex. « roulait à 15 km/h » plutôt que « trop vite »)." },
  { re: /(on peut penser|sans doute|probablement|peut[- ][êe]tre|il semble|semblerai|aurait d[ûu]|aurait pu|aurai[te]nt d[ûu]|devait [êe]tre|certainement|sûrement|surement)/i, msg: "Interprétation ou supposition : si ce n'est pas établi, enregistrez l'information comme « Hypothèse à examiner » ou « À vérifier »." }
];
function wordingIssues(text) {
  const t = String(text || '').trim(); const out = [];
  if (!t) return out;
  WORDING.forEach(w => { if (w.re.test(t)) out.push(w.msg); });
  if (/;|\s(puis|ensuite)\s|,\s*(et|puis)\s|\set\s(il|elle|ils|elles|on|a|est|était|sont|se|s['’]|l['’]|y)\s?/i.test(t)) out.push("Plusieurs informations ? Un seul fait par case : si la phrase décrit plusieurs faits, enregistrez-les séparément.");
  if (t.length > 170) out.push('Formulation longue : un fait doit être exprimé de façon concise.');
  return out;
}

  if (!phaseHas('justeavant')) add({ key: 'chrono-justeavant', prio: 'haute', concerne: "Chronologie : juste avant l'accident", pourquoi: "L'événement qui précède immédiatement l'accident est souvent la variation qui déclenche le processus.", question: "Quel événement s'est produit immédiatement avant l'accident ?", preuve: 'Témoignages, données machine (défauts, arrêts), photos de la situation.', impact: "Élevé : l'enchaînement immédiat reste inconnu.", action: { type: 'collect', q: 'c3', label: 'Répondre dans le recueil' } });
  if (!phaseHas('habituel') && !F.some(f => f.questionId === 'me2' || f.questionId === 'me4')) add({ key: 'usual', prio: 'moyenne', concerne: 'Travail habituel', pourquoi: "La méthode s'appuie sur ce qui était inhabituel (« variations ») : il faut connaître le déroulement habituel pour les repérer.", question: 'Comment ce travail se déroule-t-il habituellement, du point de vue de la victime et de ses collègues ?', preuve: 'Entretien avec les opérateurs du poste, fiche de poste, mode opératoire.', impact: 'Moyen : certaines variations peuvent passer inaperçues.', action: { type: 'collect', q: 'c0', label: 'Répondre dans le recueil' } });
  if (!phaseHas('avant')) add({ key: 'chrono-avant', prio: 'moyenne', concerne: "Chronologie : avant l'accident", pourquoi: "Les faits antérieurs permettent de remonter le plus en amont possible (organisation, préparation du travail).", question: "Que faisait la victime avant l'accident et quelle opération devait-elle réaliser ?", preuve: 'Planning, ordre de travail, témoignages.', impact: "Moyen : l'analyse risque de se limiter aux faits proches du dommage.", action: { type: 'collect', q: 'c1', label: 'Répondre dans le recueil' } });

  // Contradictions ouvertes
  a.contradictions.filter(c => c.status === 'ouverte').forEach(c => add({ key: 'con-' + c.id, prio: 'haute', concerne: 'Contradiction entre : ' + c.factIds.map(id => '« ' + ft(id) + ' »').join(' / '), pourquoi: "Des informations incompatibles ne peuvent pas être retenues ensemble dans l'arbre.", question: c.description ? `Laquelle de ces informations est exacte ? (${trunc(c.description, 120)})` : 'Laquelle de ces informations est exacte, et sur quel élément repose cette conclusion ?', preuve: 'Nouvel entretien croisé, photographie, document daté, observation sur place.', impact: 'Élevé : les faits concernés sont exclus de l\'arbre retenu tant que la contradiction n\'est pas résolue.', action: { type: 'resolve', id: c.id, label: 'Résoudre la contradiction' } }));

  // Statuts des faits placés dans l'arbre
  F.forEach(f => {
    const st = effStatus(f, a); const inT = treeIds.has(f.id);
    if (inT && st === 'hypothese') add({ key: 'hyp-' + f.id, prio: 'haute', ref: f.id, concerne: `Hypothèse placée dans l'arbre de travail : « ${ft(f.id)} »`, pourquoi: "Une hypothèse n'est pas un fait établi : elle ne peut pas figurer dans l'arbre retenu.", question: `Quel élément permet de confirmer ou d'écarter : « ${ft(f.id)} » ?`, preuve: 'Constat sur place, document, témoignage précis, mesure.', impact: "Élevé : la branche concernée reste provisoire.", action: { type: 'edit', id: f.id, label: 'Mettre à jour ce fait' } });
    if (inT && st === 'averifier') add({ key: 'ver-' + f.id, prio: 'haute', ref: f.id, concerne: `Information à vérifier dans l'arbre : « ${ft(f.id)} »`, pourquoi: "Son exactitude conditionne les liens dans lesquels elle intervient.", question: `Comment vérifier : « ${ft(f.id)} » ? Qui peut le confirmer ?`, preuve: 'Témoignage d\'une autre personne, photo, document, observation de l\'équipement.', impact: 'Élevé : le fait est exclu de l\'arbre retenu tant qu\'il n\'est pas vérifié.', action: { type: 'edit', id: f.id, label: 'Mettre à jour ce fait' } });
    if (st === 'manquant') add({ key: 'man-' + f.id, prio: inT ? 'haute' : 'moyenne', ref: f.id, concerne: `Information manquante : « ${ft(f.id)} »`, pourquoi: 'Cet élément a été identifié comme nécessaire à la compréhension de l\'accident.', question: `Pouvez-vous fournir l'information suivante : « ${ft(f.id)} » ?`, preuve: 'Selon le cas : photo, relevé de réglage, fiche de maintenance, témoignage.', impact: inT ? 'Élevé : un maillon de l\'arbre reste inconnu.' : 'Moyen.', action: { type: 'edit', id: f.id, label: 'Compléter ce fait' } });
  });

  // Indépendance (conjonction / disjonction)
  independenceIssues(a).forEach(i => add({ key: `ind-${i.type}-${i.at}-${i.a}-${i.b}`, prio: 'haute', concerne: `${i.type === 'conjonction' ? 'Conjonction' : 'Disjonction'} au niveau de « ${ft(i.at)} »`, pourquoi: `Selon la méthode, les faits d'une ${i.type} doivent être indépendants l'un de l'autre. Or « ${ft(i.a)} » et « ${ft(i.b)} » sont déjà reliés par un enchaînement.`, question: 'Ce lien direct est-il justifié, ou faut-il le supprimer et conserver seulement l\'enchaînement existant ?', preuve: 'Relecture de l\'arbre par le groupe d\'analyse.', impact: 'Élevé : bloque la validation de l\'arbre.', action: { type: 'goto', step: 5, label: 'Ouvrir l\'arbre' } }));

  // Liens
  L.forEach(l => {
    const lbl = `Lien « ${ft(l.from)} » → « ${ft(l.to)} »`;
    if (l.necessity !== 'confirmee') add({ key: 'nec-' + l.id, prio: 'moyenne', concerne: lbl, pourquoi: "Chaque lien doit traduire une relation de nécessité : l'antécédent a-t-il été nécessaire pour que le fait se produise ?", question: `Sans « ${ft(l.from)} », « ${ft(l.to)} » se serait-il produit ?`, preuve: 'Discussion en groupe d\'analyse à partir des faits recueillis.', impact: 'Moyen : ce lien bloque la validation de l\'arbre tant qu\'il n\'est pas confirmé.', action: { type: 'link', id: l.id, label: 'Examiner le lien' } });
    if (l.uncertain) add({ key: 'unc-' + l.id, prio: 'moyenne', concerne: lbl + ' (trait en pointillé)', pourquoi: "Une incertitude subsiste sur la façon dont ce fait est apparu.", question: `Quels éléments permettent de préciser comment « ${ft(l.to)} » s'est produit ?`, preuve: 'Témoignage, essai ou observation de l\'équipement à l\'arrêt, documents de maintenance.', impact: 'Moyen : la relation reste incertaine dans le dossier.', action: { type: 'link', id: l.id, label: 'Examiner le lien' } });
    const ci = chronoIssue(l, a);
    if (ci) add({ key: 'chr-' + l.id, prio: 'moyenne', concerne: lbl, pourquoi: 'La chronologie enregistrée semble incompatible avec le sens du lien. ' + ci, question: "L'ordre des faits est-il exact ? Sinon, lequel faut-il corriger ?", preuve: 'Horaires, enregistrements machine, témoignages datés.', impact: 'Moyen : le lien ou la chronologie doit être corrigé.', action: { type: 'link', id: l.id, label: 'Examiner le lien' } });
  });

  // Faits de l'arbre : variations sans antécédent, formulation, source
  F.filter(f => treeIds.has(f.id)).forEach(f => {
    if (f.kind === 'variation' && f.id !== model.root && !ins(f.id, a).length && isEst(f, a)) add({ key: 'leaf-' + f.id, prio: 'moyenne', ref: f.id, concerne: `Variation sans antécédent : « ${ft(f.id)} »`, pourquoi: "La méthode cherche à remonter le plus en amont possible : comment cette variation est-elle apparue ?", question: `Qu'a-t-il fallu pour que « ${ft(f.id)} » se produise ?`, preuve: 'Entretien avec l\'encadrement, la maintenance, les méthodes ; documents d\'organisation.', impact: "Moyen : l'analyse s'arrête à ce fait. Le groupe peut décider, de façon pragmatique, d'arrêter ici (écarter ce point en le justifiant).", action: { type: 'ante', id: f.id, label: 'Ajouter un antécédent' } });
    const w = wordingIssues(f.text);
    if (w.length) add({ key: 'wd-' + f.id, prio: 'moyenne', ref: f.id, concerne: `Formulation : « ${ft(f.id)} »`, pourquoi: w.join(' '), question: 'Quels faits observables cette formulation recouvre-t-elle ?', preuve: 'Description précise de ce qui a été vu, entendu ou mesuré.', impact: 'Moyen : une formulation imprécise ou un jugement fausse la lecture de l\'arbre.', action: { type: 'edit', id: f.id, label: 'Reformuler' } });
    if ((f.source?.type || 'apreciser') === 'apreciser') add({ key: 'src-' + f.id, prio: 'moyenne', ref: f.id, concerne: `Provenance non précisée : « ${ft(f.id)} »`, pourquoi: 'Chaque fait doit avoir une provenance identifiable.', question: 'Qui a rapporté cette information, ou sur quel document / constat repose-t-elle ?', preuve: 'Fonction de la personne, référence du document.', impact: 'Moyen : traçabilité incomplète.', action: { type: 'edit', id: f.id, label: 'Préciser la source' } });
  });
  const undet = F.filter(f => treeIds.has(f.id) && f.kind === 'indetermine');
  if (undet.length) add({ key: 'kind', prio: 'faible', concerne: `${undet.length} fait(s) de l'arbre sans distinction habituel / inhabituel`, list: undet.map(f => f.id), pourquoi: "La méthode distingue les états (habituels, rectangles) et les variations (inhabituelles, cercles) : les variations guident l'analyse.", question: 'Pour chacun de ces faits : était-ce la situation habituelle ou un écart par rapport à l\'habituel ?', preuve: 'Témoignage des opérateurs habituels du poste.', impact: 'Faible : la représentation graphique reste incomplète.', action: { type: 'goto', step: 5, label: 'Ouvrir l\'arbre' } });

  // Faits établis non placés
  const orphans = F.filter(f => !treeIds.has(f.id) && isEst(f, a));
  if (orphans.length && model.root) add({ key: 'orphans', prio: 'faible', concerne: `${orphans.length} fait(s) établi(s) non placé(s) dans l'arbre`, list: orphans.map(f => f.id), pourquoi: "Un fait recueilli peut avoir contribué à l'accident ; il peut aussi être sans rapport.", question: "Ces faits ont-ils été nécessaires à l'un des faits de l'arbre ? Si oui, lequel ?", preuve: 'Discussion en groupe d\'analyse.', impact: 'Faible : à examiner, sans obligation de tout placer.', action: { type: 'goto', step: 5, label: 'Ouvrir l\'arbre' } });

  // 5M non renseignés (sans chercher à tout remplir)
  const emptyFam = Object.keys(M5_Q).filter(k => !a.m5[k]?.na && !F.some(f => f.family === k));
  if (emptyFam.length && F.length) add({ key: 'm5', prio: 'faible', concerne: 'Familles du questionnement 5M sans information : ' + emptyFam.map(k => FAMILIES[k].label).join(', '), pourquoi: "Ces familles aident à ne rien oublier. Elles peuvent être sans objet pour cet accident : il n'est pas nécessaire de les remplir artificiellement.", question: 'Ces familles apportent-elles des faits utiles ? Sinon, marquez-les « sans objet ».', preuve: '—', impact: 'Faible.', action: { type: 'collectTab', tab: 'm5', label: 'Ouvrir le questionnement 5M' } });

  // Pièces jointes
  a.attachments.filter(x => x.kind === 'document' && x.extract && !['ok', 'manuel'].includes(x.extract.status)).forEach(x => add({ key: 'doc-' + x.id, prio: 'moyenne', concerne: `Document non exploité : « ${trunc(x.name, 60)} »`, pourquoi: "Son contenu n'a pas pu être lu par l'application : il n'a donc pas été pris en compte.", question: 'Pouvez-vous copier le texte utile de ce document, ou fournir une version TXT, DOCX ou PDF texte ?', preuve: 'Texte du document.', impact: 'Moyen : des faits utiles peuvent manquer.', action: { type: 'goto', step: 3, label: 'Ouvrir les documents' } }));
  const ph = a.attachments.filter(x => x.kind === 'photo' && !String(x.observation || '').trim());
  if (ph.length) add({ key: 'photos', prio: 'faible', concerne: `${ph.length} photographie(s) sans description de ce qu'elle(s) permet(tent) d'observer`, pourquoi: "Une photo n'est exploitable que si l'on précise ce qu'elle montre réellement.", question: 'Que voit-on précisément sur ces photos (élément, position, état) ?', preuve: '—', impact: 'Faible.', action: { type: 'goto', step: 3, label: 'Ouvrir les photos' } });

  a.whys.filter(w => w.stop && w.stop.reason === 'manque').forEach(w => add({ key: 'why-' + w.id, prio: 'moyenne', concerne: `Questionnement « pourquoi » interrompu : « ${trunc(w.subject, 70)} »`, pourquoi: "Le questionnement s'est arrêté faute d'information.", question: `Quelle information permettrait de répondre à la question : pourquoi « ${trunc(lastWhyText(w), 90)} » ?`, preuve: w.stop.note || 'Selon le cas : entretien, document, observation.', impact: 'Moyen.', action: { type: 'collectTab', tab: 'why', label: 'Ouvrir les 5 pourquoi' } }));

  const order = { haute: 0, moyenne: 1, faible: 2 };
  G.sort((x, y) => order[x.prio] - order[y.prio]);
  const dis = a.gapsDismissed || {};
  return { active: G.filter(g => !dis[g.key]), dismissed: G.filter(g => dis[g.key]) };
}
function lastWhyText(w) { const l = w.levels.filter(x => x.answer.trim()); return l.length ? l[l.length - 1].answer : w.subject; }
function confidence(gaps) {
  const h = gaps.filter(g => g.prio === 'haute').length, m = gaps.filter(g => g.prio === 'moyenne').length;
  if (h) return { lvl: 1, label: 'Confiance limitée', txt: `${h} point(s) de priorité haute restent à traiter.` };
  if (m) return { lvl: 2, label: 'Confiance moyenne', txt: `Aucun point de priorité haute ; ${m} point(s) de priorité moyenne.` };
  return { lvl: 3, label: 'Confiance satisfaisante', txt: 'Aucun point de priorité haute ou moyenne détecté par les contrôles automatiques.' };
}

/* =====================================================================
   Contrôle de l'arbre avant validation
   ===================================================================== */
function treeChecks(a = S.a) {
  const blocking = [], warnings = [];
  const work = graphModel(a, 'travail'), ret = graphModel(a, 'retenu');
  const ft = id => '« ' + trunc(factById(id, a)?.text, 70) + ' »';
  if (!work.root) blocking.push('Aucun fait ultime (dommage) n\'est défini.');
  else {
    const r = factById(work.root, a);
    if (!isEst(r, a)) blocking.push(`Le fait ultime ${ft(r.id)} n'est pas un fait établi (statut : ${STATUS[effStatus(r, a)].short}).`);
    if (!ins(work.root, a).length) blocking.push('Le fait ultime n\'a aucun antécédent.');
  }
  independenceIssues(a).forEach(i => blocking.push(`${i.type === 'conjonction' ? 'Conjonction' : 'Disjonction'} au niveau de ${ft(i.at)} : ${ft(i.a)} et ${ft(i.b)} ne sont pas indépendants.`));
  ret.links.forEach(l => { if (l.necessity !== 'confirmee') blocking.push(`Nécessité non confirmée pour le lien ${ft(l.from)} → ${ft(l.to)}.`); });
  if (work.excluded === undefined) { /* rien */ }
  const excl = ret.excluded;
  if (excl.length) warnings.push(`${excl.length} fait(s) de l'arbre de travail ne figurent pas dans l'arbre retenu (non établis, en contradiction, ou reliés au dommage uniquement par des faits non établis) : ${excl.map(ft).join(', ')}.`);
  ret.links.forEach(l => { if (l.uncertain) warnings.push(`Lien en pointillé (incertitude) : ${ft(l.from)} → ${ft(l.to)}.`); const c = chronoIssue(l, a); if (c) warnings.push(`Chronologie à vérifier pour ${ft(l.from)} → ${ft(l.to)} : ${c}`); });
  [...ret.nodeIds].forEach(id => {
    const f = factById(id, a);
    const w = wordingIssues(f.text); if (w.length) warnings.push(`Formulation à revoir : ${ft(id)}.`);
    if (f.kind === 'indetermine') warnings.push(`Type (état / variation) non précisé : ${ft(id)}.`);
    if ((f.source?.type || 'apreciser') === 'apreciser') warnings.push(`Source non précisée : ${ft(id)}.`);
  });
  return { blocking, warnings, ret };
}

/* =====================================================================
   Composants d'interface
   ===================================================================== */
function toast(msg, type = '', ms = 4500) {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), ms);
}
function stBadge(s) { const d = STATUS[s] || STATUS.rapporte; return `<span class="st st-${s}"><span class="g" aria-hidden="true">${d.g}</span>${esc(d.short)}</span>`; }
function factBadge(f, a = S.a) {
  const e = effStatus(f, a);
  return e === 'contradiction' && f.status !== 'contradiction' ? stBadge('contradiction') + ' <span class="xs muted">(saisi : ' + esc(STATUS[f.status].short) + ')</span>' : stBadge(e);
}
function kindTag(k) { return `<span class="kind ${k}"><i aria-hidden="true"></i>${esc(KINDS[k]?.short || '')}</span>`; }
function srcTxt(f) { const s = f.source || {}; return (SOURCES[s.type] || 'À préciser') + (s.detail ? ' – ' + s.detail : ''); }
function opts(obj, sel, labelFn) { return Object.entries(obj).map(([k, v]) => `<option value="${esc(k)}" ${k === sel ? 'selected' : ''}>${esc(labelFn ? labelFn(k, v) : (v.label || v))}</option>`).join(''); }

function modal({ title, body, buttons = [{ label: 'Fermer', value: 'close' }], wide = false, onOpen, onAction }) {
  return new Promise(resolve => {
    const d = document.createElement('dialog'); if (wide) d.className = 'wide';
    const tid = uid('dt'); d.setAttribute('aria-labelledby', tid);
    d.innerHTML = `<div class="dlg"><header><h2 id="${tid}">${esc(title)}</h2><button type="button" class="icon-btn" data-x aria-label="Fermer la fenêtre">✕</button></header><div class="dlg-body">${body}</div><footer>${buttons.map(b => `<button type="button" class="btn ${b.cls || ''}" data-v="${esc(b.value)}">${b.icon ? icon(b.icon) : ''}${esc(b.label)}</button>`).join('')}</footer></div>`;
    document.body.appendChild(d);
    let done = false;
    const finish = v => { if (done) return; done = true; try { d.close(); } catch (e) { } d.remove(); resolve(v); };
    d.addEventListener('cancel', e => { e.preventDefault(); finish(null); });
    d.addEventListener('click', async e => {
      if (e.target.closest('[data-x]')) { finish(null); return; }
      const b = e.target.closest('footer [data-v]'); if (!b) return;
      const v = b.dataset.v;
      if (onAction) { const r = await onAction(v, d); if (r === false) return; if (r !== undefined && r !== true) { finish(r); return; } }
      finish(v);
    });
    d.showModal();
    if (onOpen) onOpen(d);
    const ff = d.querySelector('.dlg-body [autofocus]') || d.querySelector('.dlg-body textarea, .dlg-body input:not([type=radio]):not([type=checkbox]), .dlg-body select');
    if (ff) ff.focus();
  });
}
async function confirmBox(text, { title = 'Confirmation', ok = 'Confirmer', danger = false } = {}) {
  const v = await modal({ title, body: `<p>${text}</p>`, buttons: [{ label: 'Annuler', value: 'no' }, { label: ok, value: 'yes', cls: danger ? 'danger solid' : 'primary' }] });
  return v === 'yes';
}
async function askText(title, label, { required = false, value = '', hint = '', multiline = false, ok = 'Valider' } = {}) {
  const id = uid('ask');
  const field = multiline ? `<textarea id="${id}" rows="3">${esc(value)}</textarea>` : `<input type="text" id="${id}" value="${esc(value)}">`;
  const v = await modal({
    title, body: `<div class="field"><label for="${id}">${esc(label)}</label>${field}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}<div class="err" id="${id}-e" role="alert" hidden>Ce champ est obligatoire.</div></div>`,
    buttons: [{ label: 'Annuler', value: 'cancel' }, { label: ok, value: 'ok', cls: 'primary' }],
    onAction: (v, d) => { if (v !== 'ok') return; const t = d.querySelector('#' + id).value.trim(); if (required && !t) { d.querySelector('#' + id + '-e').hidden = false; d.querySelector('#' + id).setAttribute('aria-invalid', 'true'); return false; } return { text: t }; }
  });
  return v && typeof v === 'object' ? v.text : null;
}

/* ---------------- Éditeur de fait ---------------- */
async function factEditor(fid, defaults = {}, opt = {}) {
  const isNew = !fid;
  const base = isNew ? newFact(defaults) : clone(factById(fid));
  if (!base) return null;
  const atts = S.a.attachments;
  const linkedAtt = isNew ? (defaults._att || []) : atts.filter(x => x.factIds.includes(fid)).map(x => x.id);
  const body = `
  ${opt.intro ? `<div class="note info">${icon('info')}<div>${opt.intro}</div></div>` : ''}
  <div class="field"><label for="fe-text">Description du fait <span class="muted">(obligatoire)</span></label>
    <textarea id="fe-text" rows="3" aria-describedby="fe-text-h fe-check" autofocus>${esc(base.text)}</textarea>
    <div class="hint" id="fe-text-h">Une seule information, concise, observable ou vérifiable. Pas de jugement, pas d'interprétation, pas de « manque de… ».</div>
    <div class="err" id="fe-text-err" role="alert" hidden>Décrivez le fait.</div>
    <div class="check-msgs" id="fe-check" aria-live="polite"></div></div>
  <fieldset style="margin-top:12px"><legend>Statut de l'information</legend><div class="radio-cards">
    ${['rapporte', 'corrobore', 'averifier', 'manquant', 'hypothese'].map(s => `<label><input type="radio" name="fe-st" value="${s}" ${base.status === s ? 'checked' : ''}><span>${stBadge(s)}<br><span class="xs muted">${esc(STATUS[s].help)}</span></span></label>`).join('')}
  </div><div class="hint">Le statut « Contradiction » est attribué automatiquement quand une contradiction est signalée. Un fait rapporté ne devient jamais corroboré automatiquement.</div></fieldset>
  <div class="field" style="margin-top:10px"><label for="fe-ev">Élément probant <span class="muted" id="fe-ev-req">(obligatoire pour un fait corroboré)</span></label>
    <textarea id="fe-ev" rows="2" placeholder="Ex. : photo n°2 montrant le carter ouvert ; rapport de maintenance du 12/03">${esc(base.evidence)}</textarea>
    <div class="err" id="fe-ev-err" role="alert" hidden>Indiquez l'élément probant qui confirme ce fait, ou choisissez un autre statut.</div></div>
  <div class="grid g2" style="margin-top:10px">
    <div class="field"><label for="fe-kind">Habituel ou inhabituel ?</label><select id="fe-kind">${opts(KINDS, base.kind)}</select><div class="hint">Variation = écart par rapport à l'habituel (cercle). État = situation habituelle (rectangle).</div></div>
    <div class="field"><label for="fe-fam">Famille (5M)</label><select id="fe-fam">${opts(FAMILIES, base.family, (k, v) => v.label + (k !== 'NC' ? ' (INRS : ' + v.inrs + ')' : ''))}</select></div>
    <div class="field"><label for="fe-phase">Moment dans la chronologie</label><select id="fe-phase">${opts(PHASES, base.chrono.phase || '')}</select></div>
    <div class="grid g2" style="gap:10px">
      <div class="field"><label for="fe-order">N° d'ordre</label><input type="number" id="fe-order" min="0" step="1" value="${base.chrono.order ?? ''}"><div class="hint">1, 2, 3… dans l'ordre des événements</div></div>
      <div class="field"><label for="fe-moment">Heure / moment</label><input type="text" id="fe-moment" value="${esc(base.chrono.moment || '')}" placeholder="ex. vers 9 h 40"></div>
    </div>
    <div class="field"><label for="fe-src">Source de l'information</label><select id="fe-src">${opts(SOURCES, base.source.type || 'apreciser')}</select></div>
    <div class="field"><label for="fe-srcd">Précision sur la source</label><input type="text" id="fe-srcd" value="${esc(base.source.detail || '')}" placeholder="Fonction, document… (pas de nom de personne)"></div>
    <div class="field"><label for="fe-cert">Degré de certitude</label><select id="fe-cert">${opts(CERTAINTY, base.certainty)}</select></div>
  </div>
  ${atts.length ? `<fieldset style="margin-top:10px"><legend>Photos et documents associés</legend><div class="radio-list">${atts.map(x => `<label><input type="checkbox" name="fe-att" value="${x.id}" ${linkedAtt.includes(x.id) ? 'checked' : ''}> ${x.kind === 'photo' ? '📷' : '📄'} ${esc(x.caption || x.name)}</label>`).join('')}</div></fieldset>` : ''}
  <div class="field" style="margin-top:10px"><label for="fe-notes">Observations complémentaires</label><textarea id="fe-notes" rows="2">${esc(base.notes)}</textarea></div>
  ${!isNew ? `<div class="field" style="margin-top:10px"><label for="fe-reason">Motif de la modification</label><input type="text" id="fe-reason" placeholder="Ex. : précision apportée par le chef d'équipe"><div class="hint">L'ancienne version est conservée dans l'historique du fait.</div></div>` : ''}`;
  const res = await modal({
    title: isNew ? 'Nouveau fait' : 'Modifier le fait', body, wide: true,
    buttons: [{ label: 'Annuler', value: 'cancel' }, { label: isNew ? 'Enregistrer le fait' : 'Enregistrer les modifications', value: 'save', cls: 'primary', icon: 'check' }],
    onOpen: d => {
      const upd = () => {
        const t = d.querySelector('#fe-text').value; const w = wordingIssues(t);
        d.querySelector('#fe-check').innerHTML = w.map(m => `<div>⚠ ${esc(m)}</div>`).join('');
        const st = d.querySelector('input[name=fe-st]:checked')?.value;
        d.querySelector('#fe-ev-req').textContent = st === 'corrobore' ? '(obligatoire pour un fait corroboré)' : '(facultatif)';
      };
      d.querySelector('#fe-text').addEventListener('input', upd);
      d.querySelectorAll('input[name=fe-st]').forEach(r => r.addEventListener('change', upd)); upd();
    },
    onAction: (v, d) => {
      if (v !== 'save') return;
      const g = s => d.querySelector(s);
      const text = g('#fe-text').value.trim(); const status = g('input[name=fe-st]:checked')?.value || 'rapporte';
      const evidence = g('#fe-ev').value.trim();
      let ok = true;
      g('#fe-text-err').hidden = !!text; g('#fe-text').setAttribute('aria-invalid', !text); if (!text) ok = false;
      const evBad = status === 'corrobore' && !evidence;
      g('#fe-ev-err').hidden = !evBad; g('#fe-ev').setAttribute('aria-invalid', evBad); if (evBad) ok = false;
      if (!ok) { (text ? g('#fe-ev') : g('#fe-text')).focus(); return false; }
      const ord = g('#fe-order').value;
      const vals = {
        text, status, evidence, kind: g('#fe-kind').value, family: g('#fe-fam').value,
        'chrono.phase': g('#fe-phase').value, 'chrono.order': ord === '' ? null : Number(ord), 'chrono.moment': g('#fe-moment').value.trim(),
        'source.type': g('#fe-src').value, 'source.detail': g('#fe-srcd').value.trim(), certainty: g('#fe-cert').value, notes: g('#fe-notes').value.trim()
      };
      const attSel = $$('input[name=fe-att]:checked', d).map(i => i.value);
      let id;
      if (isNew) {
        const f = newFact({ origin: base.origin, questionId: base.questionId });
        Object.entries(vals).forEach(([p, x]) => setPath(f, p, x));
        addFact(f, opt.why); id = f.id;
      } else {
        updateFact(fid, vals, g('#fe-reason').value.trim()); id = fid;
      }
      atts.forEach(x => {
        const has = x.factIds.includes(id), want = attSel.includes(x.id);
        if (has && !want) { x.factIds = x.factIds.filter(i => i !== id); log('piece', `Pièce « ${trunc(x.caption || x.name, 40)} » dissociée du fait « ${trunc(text, 50)} »`); }
        if (!has && want) { x.factIds.push(id); log('piece', `Pièce « ${trunc(x.caption || x.name, 40)} » associée au fait « ${trunc(text, 50)} »`); }
      });
      changed();
      return { id };
    }
  });
  return res && typeof res === 'object' ? res.id : null;
}

/* ---------------- Contradictions ---------------- */
async function contradictionDialog(fid) {
  const f = factById(fid);
  const others = liveFacts().filter(x => x.id !== fid);
  if (!others.length) { toast('Il faut au moins deux faits pour signaler une contradiction.', 'warn'); return; }
  const v = await modal({
    title: 'Signaler une contradiction', wide: true,
    body: `<p>Fait concerné : <b>« ${esc(f.text)} »</b></p>
    <fieldset><legend>Avec quel(s) fait(s) est-il incompatible ?</legend><input type="search" id="cd-q" placeholder="Filtrer…" aria-label="Filtrer les faits" style="margin-bottom:8px">
    <div class="radio-list" id="cd-list" style="max-height:260px;overflow:auto">${others.map(o => `<label data-t="${esc(o.text.toLowerCase())}"><input type="checkbox" value="${o.id}"> <span>${esc(o.text)} ${factBadge(o)}</span></label>`).join('')}</div>
    <div class="err" id="cd-e1" role="alert" hidden>Sélectionnez au moins un fait.</div></fieldset>
    <div class="field" style="margin-top:10px"><label for="cd-desc">En quoi ces informations sont-elles incompatibles ?</label><textarea id="cd-desc" rows="2" placeholder="Ex. : le témoin 1 situe le poussoir sur l'établi, le témoin 2 sur son support."></textarea></div>
    <div class="note warn">${icon('alert')}<div>Tant que la contradiction n'est pas résolue, les faits concernés sont signalés et exclus de l'arbre retenu. Aucun fait n'est supprimé.</div></div>`,
    buttons: [{ label: 'Annuler', value: 'cancel' }, { label: 'Signaler la contradiction', value: 'ok', cls: 'primary' }],
    onOpen: d => { d.querySelector('#cd-q').addEventListener('input', e => { const q = e.target.value.toLowerCase(); $$('#cd-list label', d).forEach(l => l.hidden = !l.dataset.t.includes(q)); }); },
    onAction: (v, d) => {
      if (v !== 'ok') return;
      const sel = $$('#cd-list input:checked', d).map(i => i.value);
      if (!sel.length) { d.querySelector('#cd-e1').hidden = false; return false; }
      const c = { id: uid('c'), factIds: [fid, ...sel], description: d.querySelector('#cd-desc').value.trim(), status: 'ouverte', createdAt: nowISO(), resolution: null };
      S.a.contradictions.push(c);
      log('contradiction', `Contradiction signalée entre ${c.factIds.length} faits : ${c.factIds.map(i => '« ' + trunc(factById(i).text, 40) + ' »').join(' / ')}`);
      if (c.factIds.some(i => inTree(i))) treeTouched('contradiction signalée');
      changed(); return { ok: 1 };
    }
  });
  if (v) { toast('Contradiction enregistrée.', 'ok'); render(); }
}
async function resolveContradiction(cid) {
  const c = S.a.contradictions.find(x => x.id === cid); if (!c) return;
  const v = await modal({
    title: 'Résoudre la contradiction', wide: true,
    body: `${c.description ? `<p class="muted">${esc(c.description)}</p>` : ''}
    <p>Pour chaque fait, indiquez la conclusion retenue. Aucune donnée n'est effacée : les faits écartés restent consultables dans l'historique.</p>
    <table class="tbl"><thead><tr><th>Fait</th><th>Conclusion</th></tr></thead><tbody>${c.factIds.map(id => { const f = factById(id); return `<tr><td>${esc(f?.text || '(fait supprimé)')}<br>${f ? stBadge(f.status) : ''}</td><td><select data-f="${id}" aria-label="Conclusion pour ce fait"><option value="keep">Retenu (statut inchangé)</option><option value="verify">À vérifier</option><option value="drop">Écarté (retiré de l'analyse)</option></select></td></tr>`; }).join('')}</tbody></table>
    <div class="field" style="margin-top:12px"><label for="rc-txt">Sur quoi repose cette conclusion ? <span class="muted">(obligatoire)</span></label><textarea id="rc-txt" rows="2" placeholder="Ex. : photo prise par le chef d'équipe à 10 h montrant le poussoir sur son support."></textarea><div class="err" id="rc-e" role="alert" hidden>Indiquez l'élément qui permet de trancher.</div></div>
    <div class="grid g2" style="margin-top:8px"><div class="field"><label for="rc-src">Source</label><select id="rc-src">${opts(SOURCES, 'apreciser')}</select></div><div class="field"><label for="rc-srcd">Précision</label><input type="text" id="rc-srcd"></div></div>`,
    buttons: [{ label: 'Annuler', value: 'cancel' }, { label: 'Enregistrer la résolution', value: 'ok', cls: 'primary' }],
    onAction: (v, d) => {
      if (v !== 'ok') return;
      const txt = d.querySelector('#rc-txt').value.trim();
      if (!txt) { d.querySelector('#rc-e').hidden = false; return false; }
      const decisions = {};
      $$('select[data-f]', d).forEach(s => decisions[s.dataset.f] = s.value);
      c.status = 'resolue'; c.resolution = { text: txt, source: { type: d.querySelector('#rc-src').value, detail: d.querySelector('#rc-srcd').value.trim() }, decisions, date: nowISO() };
      log('contradiction', `Contradiction résolue : ${txt}`);
      Object.entries(decisions).forEach(([id, dec]) => {
        if (dec === 'verify') updateFact(id, { status: 'averifier' }, 'Résolution de contradiction : ' + txt);
        if (dec === 'drop') deleteFact(id, 'Écarté lors de la résolution d\'une contradiction : ' + txt);
      });
      if (c.factIds.some(i => inTree(i))) treeTouched('résolution d\'une contradiction');
      changed(); return { ok: 1 };
    }
  });
  if (v) { toast('Contradiction résolue. Les éléments concernés ont été réexaminés.', 'ok'); render(); }
}

/* ---------------- Assistant de liaison (questionnement INRS) ---------------- */
async function linkWizard({ to = null, from = null }) {
  const mode = to ? 'ante' : 'cons';
  const fixed = factById(to || from);
  const L = activeLinks();
  const candidates = () => liveFacts().filter(f => {
    if (f.id === fixed.id) return false;
    if (mode === 'ante') return !L.some(l => l.from === f.id && l.to === to) && !isAncestor(to, f.id);
    return !L.some(l => l.from === from && l.to === f.id) && !isAncestor(f.id, from);
  }).sort((x, y) => (inTree(y.id) - inTree(x.id)) || ((PHASES[y.chrono.phase || '']?.rank ?? -1) - (PHASES[x.chrono.phase || '']?.rank ?? -1)));
  const existing = mode === 'ante' ? ins(to).map(l => factById(l.from)) : outs(from).map(l => factById(l.to));
  const listHTML = sel => candidates().map(f => `<label data-t="${esc(f.text.toLowerCase())}"><input type="radio" name="lw-f" value="${f.id}" ${sel === f.id ? 'checked' : ''}> <span>${esc(f.text)} ${factBadge(f)} ${kindTag(f.kind)}${inTree(f.id) ? ' <span class="pill">dans l\'arbre</span>' : ''}</span></label>`).join('') || '<p class="muted">Aucun fait disponible : saisissez un nouveau fait.</p>';
  const q = mode === 'ante'
    ? `Qu'a-t-il fallu pour que « ${esc(fixed.text)} » se produise ?`
    : `Pour quel fait « ${esc(fixed.text)} » a-t-il été nécessaire ?`;
  let newId = null;
  const res = await modal({
    title: mode === 'ante' ? 'Ajouter un antécédent' : 'Relier à un fait conséquent', wide: true,
    body: `<div class="note info">${icon('q')}<div><b>${q}</b><br><span class="small">Choisissez un fait recueilli ou saisissez-en un nouveau. N'ajoutez que des faits rapportés par l'entreprise : l'application n'invente aucun fait intermédiaire.</span></div></div>
    ${existing.length ? `<p class="small">${mode === 'ante' ? 'Antécédents déjà reliés' : 'Conséquents déjà reliés'} : ${existing.map(f => '« ' + esc(trunc(f.text, 60)) + ' »').join(', ')}. ${mode === 'ante' ? 'Le nouveau fait formera avec eux une <b>conjonction</b> (ET) : ils doivent être indépendants.' : 'Ce fait formera une <b>disjonction</b> (ET) : les conséquents doivent être indépendants.'}</p>` : ''}
    <fieldset><legend>1. Le fait ${mode === 'ante' ? 'antécédent' : 'conséquent'}</legend>
      <div class="row" style="margin-bottom:8px"><input type="search" id="lw-q" placeholder="Filtrer les faits…" aria-label="Filtrer les faits" style="flex:1;min-width:180px"><button type="button" class="btn sm" id="lw-new">${icon('plus')}Saisir un nouveau fait…</button></div>
      <div class="radio-list" id="lw-list" style="max-height:240px;overflow:auto">${listHTML(null)}</div>
      <div class="err" id="lw-e1" role="alert" hidden>Choisissez un fait.</div></fieldset>
    <fieldset style="margin-top:10px"><legend>2. Relation de nécessité</legend><div class="radio-list">
      <label><input type="radio" name="lw-n" value="confirmee"> <span><b>Oui</b> : sans ${mode === 'ante' ? 'ce fait' : '« ' + esc(trunc(fixed.text, 50)) + ' »'}, ${mode === 'ante' ? '« ' + esc(trunc(fixed.text, 50)) + ' »' : 'le fait choisi'} ne se serait pas produit.</span></label>
      <label><input type="radio" name="lw-n" value="a-verifier" checked> <span><b>À confirmer</b> par le groupe d'analyse.</span></label></div></fieldset>
    <fieldset style="margin-top:10px"><legend>3. Certitude sur la façon dont le fait est apparu</legend><div class="radio-list">
      <label><input type="radio" name="lw-u" value="0" checked> <span>Le lien est établi par les informations recueillies (trait plein).</span></label>
      <label><input type="radio" name="lw-u" value="1"> <span>Une part d'incertitude subsiste (trait en pointillé).</span></label></div></fieldset>
    <div class="field" style="margin-top:10px"><label for="lw-j">Sur quelles informations repose ce lien ? <span class="muted">(recommandé)</span></label><textarea id="lw-j" rows="2" placeholder="Ex. : récit de la victime ; photo n°1"></textarea></div>`,
    buttons: [{ label: 'Annuler', value: 'cancel' }, { label: 'Ajouter le lien', value: 'ok', cls: 'primary', icon: 'link' }],
    onOpen: d => {
      const filt = () => { const qq = d.querySelector('#lw-q').value.toLowerCase(); $$('#lw-list label', d).forEach(l => l.hidden = !l.dataset.t.includes(qq)); };
      d.querySelector('#lw-q').addEventListener('input', filt);
      d.querySelector('#lw-new').addEventListener('click', async () => {
        const defaults = mode === 'ante' ? { chrono: { phase: fixed.chrono.phase === 'dommage' ? 'moment' : (fixed.chrono.phase || ''), order: null, moment: '' } } : {};
        const id = await factEditor(null, Object.assign({ origin: { type: 'arbre' } }, defaults), { why: 'saisi lors de la construction de l\'arbre', intro: mode === 'ante' ? `Fait nécessaire pour que « ${esc(fixed.text)} » se produise.` : '' });
        if (id) { newId = id; d.querySelector('#lw-list').innerHTML = listHTML(id); d.querySelector('#lw-q').value = ''; d.querySelector('input[name=lw-f]:checked')?.scrollIntoView({ block: 'nearest' }); }
      });
    },
    onAction: async (v, d) => {
      if (v !== 'ok') return;
      const sel = d.querySelector('input[name=lw-f]:checked')?.value;
      if (!sel) { d.querySelector('#lw-e1').hidden = false; return false; }
      const x = mode === 'ante' ? sel : from, y = mode === 'ante' ? to : sel;
      // Indépendance (conjonction / disjonction)
      const siblings = mode === 'ante' ? ins(y).map(l => l.from) : outs(x).map(l => l.to);
      const other = mode === 'ante' ? x : y;
      const dep = siblings.find(s => isAncestor(s, other) || isAncestor(other, s));
      if (dep) {
        const okDep = await confirmBox(`« ${esc(trunc(factById(other).text, 70))} » et « ${esc(trunc(factById(dep).text, 70))} » sont déjà reliés par un enchaînement : ils ne sont pas indépendants. Selon la méthode, les faits d'une ${mode === 'ante' ? 'conjonction' : 'disjonction'} doivent être indépendants. Il est généralement préférable de ne pas créer ce lien direct.<br><br>Créer quand même ce lien ? Il sera signalé et bloquera la validation de l'arbre.`, { title: 'Faits non indépendants', ok: 'Créer quand même', danger: true });
        if (!okDep) return false;
      }
      const r = addLink(x, y, { necessity: d.querySelector('input[name=lw-n]:checked').value, uncertain: d.querySelector('input[name=lw-u]:checked').value === '1', justification: d.querySelector('#lw-j').value.trim() });
      if (r.err) { toast(r.err, 'bad'); return false; }
      return { link: r.link.id, x, y };
    }
  });
  if (!res || typeof res !== 'object') { if (newId) render(); return null; }
  S.sel = { type: 'fact', id: res.x };
  render();
  if (mode === 'ante') {
    const more = await modal({
      title: "A-t-il fallu autre chose ?",
      body: `<p>Pour que « <b>${esc(fixed.text)}</b> » se produise, a-t-il fallu <b>autre chose</b> que « ${esc(factById(res.x).text)} » ?</p><p class="small muted">Si oui, le fait suivant formera une conjonction (ET) : les deux faits, indépendants l'un de l'autre, auront été conjointement nécessaires.</p>`,
      buttons: [{ label: 'Je ne sais pas encore', value: 'later' }, { label: 'Non, rien d\'autre', value: 'no' }, { label: 'Oui, ajouter un autre fait (ET)', value: 'yes', cls: 'primary' }]
    });
    if (more === 'yes') return linkWizard({ to });
    if (more === 'later') { log('arbre', `Question « A-t-il fallu autre chose pour que « ${trunc(fixed.text, 50)} » ? » laissée en suspens`); changed(); }
  }
  return res;
}

function stepMeta(i) {
  const a = S.a; if (!a) return '';
  const F = liveFacts();
  switch (STEPS[i].id) {
    case 'ctx': return a.accident.description ? 'renseigné' : '';
    case 'collect': return F.length ? F.length + ' fait(s)' : '';
    case 'files': return a.attachments.length ? a.attachments.length + ' fichier(s)' : '';
    case 'tree': return a.tree.status === 'valide' ? 'validé v' + a.tree.validatedVersion : (activeLinks().length ? 'provisoire' : '');
    case 'gaps': { const g = computeGaps().active.filter(x => x.prio === 'haute').length; return g ? g + ' prioritaire(s)' : ''; }
    case 'hist': return a.versions.length ? a.versions.length + ' version(s)' : '';
    default: return '';
  }
}
function renderStepper() {
  const nav = $('#stepper'), pr = $('#progress');
  if (!S.a) { nav.hidden = true; pr.hidden = true; return; }
  nav.hidden = false; pr.hidden = false;
  nav.innerHTML = `<ol>${STEPS.slice(1).map((s, j) => { const i = j + 1; const m = stepMeta(i); return `<li><button data-act="go" data-step="${i}" ${S.step === i ? 'aria-current="step"' : ''} class="${m && S.step !== i ? 'done' : ''}"><span class="num">${i}</span><span>${esc(s.label)}${m ? `<br><span class="meta">${esc(m)}</span>` : ''}</span></button></li>`; }).join('')}</ol>`;
  pr.firstElementChild.style.width = (S.step / (STEPS.length - 1) * 100) + '%';
}
function renderFoot() {
  const f = $('#navfoot');
  if (!S.a || S.step === 0) { f.hidden = true; return; }
  f.hidden = false;
  const prev = S.step > 1 ? STEPS[S.step - 1].label : null, next = S.step < STEPS.length - 1 ? STEPS[S.step + 1].label : null;
  f.innerHTML = `<button class="btn" data-act="go" data-step="${S.step - 1}">← ${esc(prev || 'Accueil')}</button>
  <div class="info">Étape ${S.step} sur ${STEPS.length - 1} – vous pouvez quitter et reprendre plus tard : l'analyse est enregistrée sur cet appareil.</div>
  ${next ? `<button class="btn primary" data-act="go" data-step="${S.step + 1}">${esc(next)} →</button>` : `<button class="btn primary" data-act="home">Terminer</button>`}`;
}
const VIEWS = {};
function render() {
  renderTop(); renderStepper(); renderFoot();
  const m = $('#main'); const y = window.scrollY;
  const same = m.dataset.step === String(S.step);
  m.className = STEPS[S.step].id === 'tree' ? 'wide' : '';
  try { m.innerHTML = VIEWS[STEPS[S.step].id](); }
  catch (e) { console.error(e); m.innerHTML = `<div class="note bad">${icon('alert')}<div>Erreur d'affichage : ${esc(e.message)}. Vos données ne sont pas perdues ; exportez une sauvegarde puis rechargez la page.</div></div>`; }
  m.dataset.step = S.step;
  if (same) window.scrollTo(0, y);
  const h = AFTER[STEPS[S.step].id]; if (h) h();
}
const AFTER = {};
function go(step) {
  step = Math.max(0, Math.min(STEPS.length - 1, Number(step)));
  if (step === 0) return goHome();
  S.step = step; S.needFit = true; render(); window.scrollTo(0, 0); $('#main').focus({ preventScroll: true });
}
async function goHome() {
  if (S.a) await saveNow();
  S.a = null; S.step = 0; S.sel = null;
  await refreshList(); render(); window.scrollTo(0, 0);
}
async function refreshList() {
  if (!S.dbOK) { S.list = []; return; }
  try { S.list = (await DB.all()).sort((x, y) => (y.updatedAt || '').localeCompare(x.updatedAt || '')); } catch (e) { S.list = []; }
}
async function openAnalysis(id) {
  const a = await DB.get(id); if (!a) { toast('Analyse introuvable.', 'bad'); return; }
  S.a = normalize(a); S.step = 1; S.sel = null; S.needFit = true; S.saveTxt = 'Analyse ouverte'; S.saveCls = '';
  render(); window.scrollTo(0, 0);
}

function siretCheck(s) {
  const d = String(s || '').replace(/\s/g, '');
  if (!d) return { ok: true, empty: true };
  if (!/^\d{14}$/.test(d)) return { ok: false, msg: 'Le SIRET doit comporter exactement 14 chiffres.' };
  let sum = 0; for (let i = 0; i < 14; i++) { let n = Number(d[13 - i]); if (i % 2 === 1) { n *= 2; if (n > 9) n -= 9; } sum += n; }
  if (sum % 10 === 0) return { ok: true, d };
  // Exception connue : établissements de La Poste (SIREN 356000000), somme des chiffres multiple de 5
  if (d.startsWith('356000000') && [...d].reduce((x, c) => x + Number(c), 0) % 5 === 0) return { ok: true, d };
  return { ok: false, msg: 'Ce numéro SIRET ne semble pas valide (clé de contrôle). Vérifiez la saisie.' };
}
function bindField(path, label, { type = 'text', hint = '', placeholder = '', area = false, rows = 3 } = {}) {
  const id = 'b-' + path.replace(/\./g, '-'); const v = getPath(S.a, path) ?? '';
  const ctl = area ? `<textarea id="${id}" data-bind="${path}" rows="${rows}" placeholder="${esc(placeholder)}" ${hint ? `aria-describedby="${id}-h"` : ''}>${esc(v)}</textarea>`
    : `<input type="${type}" id="${id}" data-bind="${path}" value="${esc(v)}" placeholder="${esc(placeholder)}" ${hint ? `aria-describedby="${id}-h"` : ''}>`;
  return `<div class="field"><label for="${id}">${esc(label)}</label>${ctl}${hint ? `<div class="hint" id="${id}-h">${esc(hint)}</div>` : ''}<div class="err" id="${id}-err" role="alert" hidden></div></div>`;
}

    const w = +m[1], h = +m[2]; const scale = Math.min(2, 15000 / Math.max(w, h));
    const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('conversion impossible')), 'image/png'); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('rendu de l\'image impossible')); };
    img.src = url;
  });
}

function prevBlock(f) {

</style></head><body>
<div class="np" style="text-align:right"><button onclick="window.print()" style="padding:8px 14px;font-size:14px">Imprimer / PDF</button></div>
<h1>Dossier d'analyse d'accident du travail – méthode de l'arbre des causes</h1>

${ext ? `<p class="m">Contexte public (source externe, non utilisée comme fait) : ${esc(ext.nom)}, NAF ${esc(ext.naf || '—')}${ext.section ? ' – ' + esc(NAF_SECTIONS[ext.section] || '') : ''}. Source : ${esc(a.external.source)}, consultée le ${esc(fmtDT(a.external.date))} – ${esc(a.external.fiche)}</p>` : ''}
${a.accident.description ? `<h3>Récit initial (tel que saisi)</h3><p style="white-space:pre-wrap">${esc(a.accident.description)}</p>` : ''}

${Object.keys(a.notes || {}).filter(k => a.notes[k]).length ? `<h3>Corrections et compléments apportés à la synthèse</h3><ul>${Object.entries(a.notes).filter(([k, v]) => v).map(([k, v]) => `<li>${esc(v)}</li>`).join('')}</ul>` : ''}

${rows(a.prevention.filter(p => p.text.trim() && num.has(p.factId)), [['Fait visé', p => n(p.factId) + ' ' + esc(trunc(factById(p.factId, a)?.text, 70))], ['Piste', p => esc(p.text)], ['Niveau', p => esc(LEVELS[p.level] || 'à préciser')], ['FPA', p => esc(p.fpa || '')], ['Critères', p => CRITERIA.map(c => esc(c.q) + ' ' + (p.criteria[c.id] || 'à examiner')).join('<br>')], ['Suite', p => esc({ 'a-examiner': 'à examiner', retenue: 'retenue par la direction', ecartee: 'écartée' }[p.status])], ['Pilote proposé', p => esc(p.owner || '')]])}

<p class="m" style="margin-top:30px;border-top:1px solid #C9D2DE;padding-top:8px">Référence méthodologique : INRS, ED 6163, « La méthode de l'arbre des causes – L'analyse de l'accident du travail », 3e édition (2025), révisée en novembre 2025 – ${INRS_URL}. Le questionnement 5M et les « 5 pourquoi » sont des outils complémentaires d'aide au recueil. Document produit avec l'application « Arbre des causes » v${APP.build}.</p>

async function confirmReason(text, { title = 'Confirmation', ok = 'Confirmer', label = 'Motif (facultatif, conservé dans l\'historique)' } = {}) {
  const v = await modal({
    title, body: `<p>${text}</p><div class="field"><label for="cr-r">${esc(label)}</label><input type="text" id="cr-r"></div>`,

  });
  return v && typeof v === 'object' ? v : null;
}
function exportName(ext, what = 'analyse-AT') { return `${what}_${slug(S.a?.company.raisonSociale)}_${stamp()}.${ext}`; }
async function exportAnalysis(a) {
  try {
    const txt = JSON.stringify(a);
    download(`analyse-AT_${slug(a.company.raisonSociale)}_${stamp()}.json`, txt, 'application/json');
    return txt.length;
  } catch (e) { toast('Export impossible : ' + e.message, 'bad'); return 0; }

async function importFile(file) {
  let a;
  try { a = JSON.parse(await readAs(file, 'readAsText')); }
  catch (e) { modal({ title: 'Import impossible', body: `<p>Le fichier « ${esc(file.name)} » n'est pas un fichier JSON lisible.</p>` }); return; }
  if (!a || a.format !== APP.format) { modal({ title: 'Import impossible', body: `<p>Le fichier « ${esc(file.name)} » n'est pas une sauvegarde de cette application (format attendu : ${APP.format}).</p>` }); return; }
  if (a.formatVersion > APP.formatVersion) { modal({ title: 'Import impossible', body: '<p>Cette sauvegarde provient d\'une version plus récente de l\'application.</p>' }); return; }
  try { normalize(a); } catch (e) { modal({ title: 'Import impossible', body: `<p>La sauvegarde est incomplète ou endommagée (${esc(e.message)}).</p>` }); return; }
  if (S.dbOK) {
    const ex = await DB.get(a.id).catch(() => null);
    if (ex) {
      const ch = await modal({ title: 'Analyse déjà présente', body: `<p>Une analyse portant le même identifiant existe déjà sur cet appareil (modifiée le ${esc(fmtDT(ex.updatedAt))}). La sauvegarde importée date du ${esc(fmtDT(a.updatedAt))}.</p>`, buttons: [{ label: 'Annuler', value: 'cancel' }, { label: 'Importer comme copie', value: 'copy' }, { label: 'Remplacer celle de l\'appareil', value: 'replace', cls: 'danger solid' }] });
      if (!ch || ch === 'cancel') return;
      if (ch === 'copy') { a.id = uid('an'); a.company.raisonSociale = (a.company.raisonSociale || 'Analyse') + ' (copie importée)'; }
    }
  }
  a.journal.push({ date: nowISO(), type: 'export', text: `Analyse importée depuis le fichier « ${file.name} »` });
  S.a = a; S.step = 1; S.sel = null; S.needFit = true;
  await saveNow(); render(); toast('Sauvegarde importée. Vous pouvez reprendre l\'analyse.', 'ok');
}
